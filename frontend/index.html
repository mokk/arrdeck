<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1219" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="arrdeck" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>arrdeck</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Before first paint: a stored preference wins, otherwise follow the OS.
      // Duplicating the two-line rule from src/lib/theme.ts is deliberate — the
      // module cannot load this early, and a flash of the wrong palette on every
      // cold start is worse than the duplication. Keep them in step.
      (() => {
        const stored = localStorage.getItem("arrdeck.theme");
        const palette = localStorage.getItem("arrdeck.palette");
        // Dracula has no light variant (DARK_ONLY in theme.ts)
        const light =
          palette !== "dracula" &&
          (stored === "light" ||
            (stored !== "dark" && window.matchMedia?.("(prefers-color-scheme: light)").matches));
        document.documentElement.dataset.theme = light ? "light" : "dark";
        if (palette) document.documentElement.dataset.palette = palette;
        // the palette's own background once the stylesheet is in; arrdeck's
        // light one otherwise (the dark one is the tag's default)
        const background =
          getComputedStyle(document.documentElement).getPropertyValue("--background").trim() ||
          (light ? "#f4f6fa" : "");
        if (background) {
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", background);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
